<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5a8f3a">
<title>屎必须铲 Poop Must Scoop</title>
<link rel="stylesheet" href="style.css?v=0.5.2">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <span id="hud-day">第 1 周目 · 第 1 天</span>
      <span id="hud-cans">$0</span>
      <span id="hud-cats">💍 0 点</span>
    </div>
    <div class="hud-bars">
      <div class="bar"><span class="bar-label">腰力</span><div class="bar-track"><div id="bar-stamina" class="bar-fill stamina"></div></div><span id="txt-stamina" class="bar-val">60</span></div>
      <div class="bar"><span class="bar-label">账单</span><div class="bar-track"><div id="bar-clean" class="bar-fill clean"></div></div><span id="txt-clean" class="bar-val">0%</span></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="splash" class="overlay">
      <div class="card">
        <h1>屎必须铲</h1>
        <p class="sub">Poop Must Scoop · 换皮 demo v0.2</p>
        <p>你是穷铲屎官，接了富豪家猫咪后院的活。<br>撸猫催它拉，拉了一铲收工钱。<br>账单一张接一张寄来，屎必须铲。</p>
        <p class="tip">鼠标停在猫身上自动撸（梳毛 / 揉肚子 / 剪指甲），不用点<br>便意条满了猫就蹲下拉，屎停一下鼠标就收进工钱<br>不收会被猫埋掉 · 腰力一秒一秒往下掉，直不起腰当天收工</p>
        <button id="btn-start" class="primary">开始铲</button>
        <button id="btn-reset" class="ghost">清空存档重开</button>
      </div>
    </div>
    <div id="dayend" class="overlay hidden">
      <div class="card wide settle">
        <div class="settle-head"><h2 id="de-title">腰酸了！</h2><span id="de-cash" class="cashpill">$0</span></div>
        <div id="de-body"></div>
      </div>
    </div>
    <div id="perkpick" class="overlay hidden top">
      <div class="card">
        <h2>账单付清 · 三选一</h2>
        <p class="sub">perk 在本周目内持续（原作规则）</p>
        <div id="perk-list"></div>
      </div>
    </div>
    <div id="bankrupt" class="overlay hidden top">
      <div class="card wide">
        <h2 id="bk-title">破产</h2>
        <div id="bk-summary"></div>
        <h3>戒指 <span id="bk-lp" class="cans">💍 0 点</span></h3>
        <div id="rings"></div>
        <button id="btn-newcycle" class="primary">开始新周目</button>
      </div>
    </div>
  </div>
  <footer id="foot">
    <span id="combo-hint"></span>
    <button id="btn-endday" class="ghost">收工</button>
  </footer>
</div>
<script src="game.js?v=0.5.2"></script>
</body>
</html>
