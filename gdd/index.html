<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>《再铲一坨》GDD</title>
<style>
:root{--paper:#f7efdc;--ink:#3b2a14;--brown:#6b3e1e;--gold:#b8760f;--line:#d9c9a2;--muted:#8a7a60}
*{box-sizing:border-box}
body{margin:0;background:#2a2118;color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.75}
header{background:#1b1510;color:#f3e9d6;padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:2px}
header .sub{font-size:12px;opacity:.6}
nav.tabs{margin-left:auto;display:flex;gap:6px}
nav.tabs a{color:#d6b98a;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:14px}
nav.tabs a.on{background:#ffcc4d;color:#3b2a14;font-weight:700}
.wrap{display:grid;grid-template-columns:220px 1fr;gap:0;max-width:1100px;margin:0 auto}
aside{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:20px 12px;font-size:13px}
aside a{display:block;color:#d6b98a;text-decoration:none;padding:4px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside a.h3{padding-left:20px;opacity:.75;font-size:12px}
aside a:hover{background:rgba(255,255,255,.06)}
main{background:var(--paper);padding:36px 44px 80px;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.4)}
main h1{font-size:28px;color:var(--brown);margin:0 0 6px;letter-spacing:1px}
main h2{font-size:20px;color:var(--brown);margin:38px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
main h3{font-size:16px;color:var(--gold);margin:24px 0 8px}
main p{margin:10px 0}
main blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid #ffcc4d;background:#fff6dc;color:#5a4324;border-radius:0 8px 8px 0}
main blockquote p{margin:4px 0}
main table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
main th,main td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
main th{background:#efe3c2;color:var(--brown)}
main tr:nth-child(even) td{background:#fbf5e6}
main code{background:#efe3c2;padding:1px 6px;border-radius:4px;font-size:.9em}
main pre{background:#1b1510;color:#f3e9d6;padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.6}
main pre code{background:none;padding:0;color:inherit}
main hr{border:0;border-top:1px dashed var(--line);margin:28px 0}
main strong{color:var(--brown)}
main ul,main ol{padding-left:22px}
main li{margin:4px 0}
main input[type=checkbox]{margin-right:6px}
.foot{margin-top:50px;font-size:12px;color:var(--muted)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{display:none}main{padding:24px 18px 60px}}
</style>
</head>
<body>
<header><h1>《再铲一坨》</h1><span class="sub">One More Scoop · 设计文档</span>
<nav class="tabs"><a href="#gdd" id="tab-gdd" class="on">GDD</a><a href="#brainstorm" id="tab-brainstorm">发散记录</a><a href="../" style="opacity:.6">← 屎必须铲 demo</a></nav></header>
<div class="wrap"><aside id="toc"></aside><main id="main">加载中…</main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DOCS = { gdd: '../docs/GDD_scoop_one_more.md', brainstorm: '../docs/BRAINSTORM_scoop_one_more.md' };
async function show(key) {
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.id === 'tab-' + key));
  const md = await fetch(DOCS[key] + '?v=' + Date.now()).then(r => r.text());
  const main = document.getElementById('main');
  main.innerHTML = marked.parse(md) + '<div class="foot">单一真相源：仓库 ' + DOCS[key].replace('../', '') + ' · 页面直接渲染 markdown</div>';
  const toc = document.getElementById('toc'); toc.innerHTML = '';
  main.querySelectorAll('h2,h3').forEach((h, i) => { h.id = 'h' + i; const a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent; a.className = h.tagName === 'H3' ? 'h3' : ''; toc.appendChild(a); });
  window.scrollTo(0, 0);
}
function route() { const k = location.hash.replace('#', '') ; show(DOCS[k] ? k : 'gdd'); }
window.addEventListener('hashchange', () => { const k = location.hash.replace('#', ''); if (DOCS[k]) show(k); });
route();
</script>
</body>
</html>
